<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Date Night Wheel</title>
    <!-- Bump ?v= on both assets when deploying (and ASSET_VERSION in app.js),
         so returning visitors don't get a stale cached copy from Pages. -->
    <link rel="stylesheet" href="styles.css?v=7" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>"
    />
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main class="page">
      <header class="masthead">
        <p class="kicker">Tonight's the night</p>
        <h1>Date Night Wheel</h1>
        <p id="tagline" class="tagline">Stop debating. Give it a spin.</p>
      </header>

      <nav class="tabs" role="tablist" aria-label="Pick a wheel">
        <button
          class="tab is-active"
          type="button"
          role="tab"
          data-list="restaurants"
          aria-selected="true"
        >
          🍽️ Dinner
        </button>
        <button class="tab" type="button" role="tab" data-list="bars" aria-selected="false">
          🍸 Drinks
        </button>
      </nav>

      <section class="stage">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="620" height="620" role="img" aria-label="Wheel of choices"></canvas>
          <button id="spin" class="spin-btn" type="button">Spin</button>
        </div>

        <p id="result" class="result" role="status" aria-live="polite">
          <span class="result-label">Pick a fate</span>
        </p>
      </section>

      <div class="panels">
        <section class="panel">
          <h2><span id="panel-title">The lineup</span> <span id="count" class="pill"></span></h2>

          <form id="add-form" class="add-form" autocomplete="off">
            <input
              id="add-input"
              type="text"
              maxlength="60"
              placeholder="Add a new spot…"
              aria-label="New name"
              required
            />
            <input
              id="add-weight"
              type="number"
              min="1"
              max="50"
              value="1"
              aria-label="Slices on the wheel"
              title="How many slices it gets — higher means likelier"
            />
            <button type="submit" class="btn-primary">Add</button>
          </form>

          <p id="notice" class="notice" role="alert" hidden></p>
          <ul id="list" class="list"></ul>
          <p id="storage-note" class="storage-note"></p>
          <button id="reset-local" class="btn-ghost" type="button" hidden>
            Discard my changes on this device
          </button>
        </section>

        <section class="panel">
          <h2>Recent spins</h2>
          <ol id="history" class="history"></ol>
          <button id="clear-history" class="btn-ghost" type="button" hidden>Clear history</button>
        </section>
      </div>

      <footer class="foot">
        <label class="sound-toggle">
          <input id="sound" type="checkbox" checked />
          <span>Sound</span>
        </label>
      </footer>
    </main>

    <script src="app.js?v=7"></script>
  </body>
</html>
